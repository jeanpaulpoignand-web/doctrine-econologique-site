name: Install QCM General V13 from ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip-qcm-general-v13:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          test -f qcm-general/qcm_2007_2026_github_v13.zip

      - name: Unzip V13 into qcm-general
        run: |
          rm -rf /tmp/qcm-general-v13
          mkdir -p /tmp/qcm-general-v13
          unzip -q qcm-general/qcm_2007_2026_github_v13.zip -d /tmp/qcm-general-v13

          rm -rf qcm-general/fiches qcm-general/documents qcm-general/sources
          rm -f qcm-general/index.html qcm-general/README.md

          cp -R /tmp/qcm-general-v13/* qcm-general/

          test -f qcm-general/index.html
          test -d qcm-general/fiches
          test -d qcm-general/documents
          test -d qcm-general/sources
          test -f qcm-general/sources/s6.html

      - name: Commit installed QCM files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add qcm-general
          git commit -m "Install QCM general V13" || echo "No changes to commit"
          git push
