<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light only">
    <title>Doctrine Éconologique — Souveraineté Française</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');
      :root {
        --paper: #FDFBF7;
        --paper2: #FFFFFC;
        --warm: #F5F0E3;
        --ink: #0A0A0A;
        --soft: #1F1F1F;
        --muted: #564A36;
        --line: #C5BDA8;
        --faint: #DCD4BE;
        --rouge: #8B2C1E;
        --or: #6B5520;
        --dark: #0E0E0E;
        --p1: #1F3864;
        --p2: #1A6B3A;
        --p3: #4A5159;
        --p4: #8B2C1E;
        --p5: #0E1B2E;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
        color-scheme: light;
      }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'IBM Plex Sans', sans-serif;
        line-height: 1.65;
        overflow-x: hidden;
      }
      h1, h2, h3, h4 {
        font-family: 'Cormorant Garamond', serif;
        line-height: 1.15;
      }
      a {
        color: inherit;
      }
      img[loading="lazy"] {
        opacity: 0;
        transform: scale(0.9);
        transition: opacity 0.3s ease-out, transform 0.3s ease-out;
      }
      img[loading="lazy"].lazyloaded {
        opacity: 1;
        transform: scale(1);
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(253, 251, 247, 0.97);
        border-bottom: 1px solid var(--line);
        padding: 18px 32px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .brand {
        text-decoration: none;
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .brand-name {
        font-family: 'Cormorant Garamond', serif;
        font-size: 24px;
        font-weight: 600;
      }
      .brand-version {
        font-family: 'IBM Plex Mono', monospace;
        font-size: 10px;
        color: var(--rouge);
        letter-spacing: 2px;
      }
      .nav-links {
        display: flex;
        gap: 26px;
        list-style: none;
        font-size: 14px;
        font-weight: 700;
      }
      .nav-links a {
        text-decoration: none;
      }
      .nav-links a:hover {
        color: var(--rouge);
      }
      @media (max-width: 600px) {
        .nav-links {
          display: none;
        }
        .nav {
          padding: 14px 18px;
        }
        .brand-name {
          font-size: 21px;
        }
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <a href="#accueil" class="brand">
        <span class="brand-name">Doctrine Éconologique</span>
        <span class="brand-version">v5.1</span>
      </a>
      <ul class="nav-links">
        <li><a href="#accueil">Accueil</a></li>
        <li><a href="#piliers">Piliers</a></li>
        <li><a href="#positionner">Se positionner</a></li>
        <li><a href="#methode">Méthode</a></li>
        <li><a href="https://drive.google.com/drive/folders/1QN-Evu8Bo1g1A5DcjGR7NaL8bLfm6Bbx" target="_blank">Drive</a></li>
      </ul>
    </nav>
    <script>
      // Smooth scrolling for anchor links
      document.querySelectorAll('.nav-links a').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            target.scrollIntoView({
              behavior: 'smooth',
              block: 'start',
            });
          }
        });
      });
      // Lazy loading feedback for images
      document.querySelectorAll('img[loading="lazy"]').forEach(image => {
        image.addEventListener('load', () => {
          image.classList.add('lazyloaded');
        });
      });
    </script>
  </body>
</html>
