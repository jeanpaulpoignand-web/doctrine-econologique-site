<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>Doctrine Éconologique — Souveraineté Française</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap');

:root{
  --paper:#FDFBF7;--paper2:#FFFFFC;--warm:#F5F0E3;
  --ink:#0A0A0A;--soft:#1F1F1F;--muted:#564A36;
  --line:#C5BDA8;--faint:#DCD4BE;
  --rouge:#8B2C1E;--or:#6B5520;--dark:#0E0E0E;
  --p1:#1F3864;--p2:#1A6B3A;--p3:#4A5159;--p4:#8B2C1E;--p5:#0E1B2E;
}

*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;color-scheme:light}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.65;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;line-height:1.15}
a{color:inherit}

.nav{
  position:sticky;top:0;z-index:50;background:rgba(253,251,247,.97);
  border-bottom:1px solid var(--line);padding:18px 32px;
  display:flex;justify-content:space-between;align-items:center;gap:12px
}
.brand{text-decoration:none;display:flex;gap:10px;align-items:baseline}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600}
.brand-version{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--rouge);letter-spacing:2px}
.nav-links{display:flex;gap:26px;list-style:none;font-size:14px;font-weight:700}
.nav-links a{text-decoration:none}
.nav-links a:hover{color:var(--rouge)}
@media(max-width:600px){.nav-links{display:none}.nav{padding:14px 18px}.brand-name{font-size:21px}}

.hero{padding:80px 28px 60px;text-align:center;max-width:880px;margin:auto}
.hero-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--rouge);margin-bottom:28px}
.hero h1{font-size:clamp(38px,7vw,76px);font-weight:500;margin-bottom:28px}
.hero h1 em{color:var(--rouge)}
.hero-lede{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(17px,2.4vw,22px);max-width:650px;margin:0 auto 36px}
.hero-byline{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);padding-top:24px;max-width:360px;margin:auto}

.ps-wrap{max-width:1080px;margin:auto;padding:0 28px 60px}
.ps-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.ps-card{background:var(--paper2);border:1px solid var(--line);border-left:3px solid var(--rouge);padding:28px;border-radius:4px}
.ps-card.solution{border-left-color:var(--or)}
.ps-card-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--rouge);margin-bottom:14px}
.ps-card.solution .ps-card-label{color:var(--or)}
.ps-card h3{font-size:24px;margin-bottom:14px}
@media(max-width:720px){.ps-grid{grid-template-columns:1fr}}

.section{padding:70px 28px;max-width:1080px;margin:auto}
.section-head{text-align:center;max-width:720px;margin:0 auto 48px}
.section-kicker{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--rouge);margin-bottom:12px}
.section-title{font-size:clamp(30px,4.5vw,46px);font-weight:500;margin-bottom:16px}
.section-title em{color:var(--rouge)}
.section-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--soft)}

.study-card{background:var(--paper2);border:1px solid var(--line);border-top:4px solid var(--rouge);border-radius:6px;padding:36px 32px;max-width:820px;margin:auto}
.study-label{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--rouge);margin-bottom:16px}
.study-card h3{font-size:clamp(28px,4vw,38px);margin-bottom:20px}
.study-card p{font-size:17px;color:var(--soft);margin-bottom:24px}

.study-stats{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
  padding:22px;
  background:var(--paper);
  border:1px solid var(--faint);
  border-radius:5px;
  margin-bottom:28px;
}
.study-stat-box{
  background:var(--paper2);
  border:1px solid var(--faint);
  border-left:4px solid var(--rouge);
  border-radius:4px;
  padding:16px 18px;
}
.study-stat-box.allouee{border-left-color:var(--or)}
.study-stat-num{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(34px,5vw,48px);
  font-weight:700;
  color:var(--rouge);
  line-height:1;
  margin-bottom:8px;
}
.study-stat-box.allouee .study-stat-num{color:var(--or)}
.study-stat-label{
  font-size:14px;
  color:var(--muted);
  font-weight:700;
}
.read-link{display:inline-flex;gap:8px;text-decoration:none;color:var(--rouge);font-weight:700;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--rouge);padding-bottom:5px}
.read-link:hover{color:var(--ink);border-bottom-color:var(--ink)}

.pillars-wrap{max-width:1080px;margin:auto;padding:0 28px 70px}
.pillars-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:880px){.pillars-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.pillars-grid{grid-template-columns:1fr}}

.pillar-card{background:var(--paper2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:24px;min-height:340px;display:flex;flex-direction:column}
.pillar-card.energie{--accent:var(--p1)}
.pillar-card.garantie{--accent:var(--p2)}
.pillar-card.finance{--accent:var(--p3)}
.pillar-card.culture{--accent:var(--p4)}
.pillar-card.democratie{--accent:var(--p5)}
.pillar-num{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:2px;text-transform:uppercase;font-weight:700}
.pillar-card h3{font-size:23px;margin:8px 0 10px}
.pillar-tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:15px;color:var(--soft);margin-bottom:14px}
.pillar-stat{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);border-bottom:1px solid var(--faint);padding-bottom:14px;margin-bottom:18px}
.pillar-actions{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.pillar-link{color:var(--accent);font-size:12px;font-weight:700;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--accent);align-self:flex-start}
.pillar-qcm-button{background:var(--accent);color:white;text-decoration:none;text-align:center;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:12px;border-radius:4px}
.pillar-highlight{background:rgba(0,0,0,.03);border-left:2px solid var(--accent);padding:12px;border-radius:0 4px 4px 0}
.pillar-highlight-label{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700}
.pillar-highlight-num{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700}
.pillar-highlight-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--soft)}

.pillar-image{
  width:100%;
  margin-top:16px;
  border-radius:8px;
  border:1px solid var(--line);
  display:block;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.position-dark{background:var(--dark);color:#F0EBDC;padding:80px 28px;text-align:center}
.position-dark .inner{max-width:760px;margin:auto}
.position-dark h2{color:#F0EBDC;font-size:clamp(30px,4.5vw,46px);font-weight:500}
.position-dark h2 em{color:#D4593F}
.position-dark .section-sub{color:#B8AE94;margin-bottom:40px}
.manifesto-text{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(24px,4vw,38px);border-top:1px solid #C9A95B;border-bottom:1px solid #C9A95B;padding:44px 20px;margin-bottom:40px}
.manifesto-text .line{display:block}
.manifesto-text .verb{color:#D4593F;font-style:normal}
.position-cta{display:inline-flex;gap:12px;align-items:center;background:#D4593F;color:white;text-decoration:none;padding:20px 36px;border-radius:4px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}
.label-beta{font-family:'IBM Plex Mono',monospace;font-size:9px;background:rgba(0,0,0,.25);padding:3px 7px;border-radius:2px}
.position-note{font-family:'Cormorant Garamond',serif;font-style:italic;color:#B8AE94;margin-top:22px}

.committee-intro{font-family:'Cormorant Garamond',serif;font-size:20px;font-style:italic;max-width:720px;text-align:center;margin:0 auto 48px}
.committee-intro em{color:var(--rouge);font-style:normal;font-weight:700}
.ia-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;max-width:900px;margin:auto}
@media(max-width:720px){.ia-grid{grid-template-columns:repeat(2,1fr)}}
.ia-card{background:var(--paper2);border:1px solid var(--line);padding:22px 14px;text-align:center;border-radius:6px}
.ia-mark{width:46px;height:46px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:white;font-weight:700}
.claude{background:#C95E3B}.gpt{background:#0F8F6E}.gemini{background:#2868D8}.grok{background:#111}.perplexity{background:#1A8A8A}
.ia-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700}
.ia-pub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted);text-transform:uppercase}
.ia-role{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;color:var(--soft)}
.committee-note{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);text-align:center;margin:40px auto 0;max-width:760px}

.colophon{background:var(--warm);padding:64px 28px 28px;border-top:1px solid var(--line)}
.colophon-inner{max-width:1080px;margin:auto}
.colophon-quote{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;text-align:center;max-width:680px;margin:0 auto 48px}
.colophon-quote:before{content:'« ';color:var(--rouge)}
.colophon-quote:after{content:' »';color:var(--rouge)}
.colophon-cols{display:grid;grid-template-columns:2fr 1fr 1fr;gap:36px;border-top:1px solid var(--line);padding-top:40px}
@media(max-width:700px){.colophon-cols{grid-template-columns:1fr}}
.colophon-brand p,.colophon-col a{font-size:13px;color:var(--soft);text-decoration:none}
