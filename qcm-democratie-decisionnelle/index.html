function esc(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function isPosition(value){return typeof value==='number' && Number.isFinite(value) && value>=0 && value<=100;}
function positionCount(){return state.answers.filter(isPosition).length;}
function proximity(answer,score){return 100-Math.abs(answer-score);}
function comparedQuestions(partyId){
  return axes.flatMap((axis,index)=>isPosition(state.answers[index]) && matrix[partyId].scores[index]!==null
    ? [{index,title:axis.title,proximity:proximity(state.answers[index],matrix[partyId].scores[index])}] : []);
}
function results(){
  return parties.map((party,order)=>{
    const per=comparedQuestions(party.id);
    return {...party,order,per,compared:per.length,score:per.length ? Math.round(per.reduce((sum,item)=>sum+item.proximity,0)/per.length) : null};
  }).filter(party=>party.compared>=6).sort((a,b)=>b.score-a.score || a.order-b.order);
}
function certainty(){const n=positionCount();return n===12?'Certitude élevée':n>=9?'Certitude moyenne':n>=6?'Certitude faible':null;}
function measuredGaps(ranked){
  const messages=[];
  axes.forEach((axis,index)=>{
    const covered=parties.filter(party=>matrix[party.id].scores[index]!==null).length;
    if(covered<10) messages.push(`Seuls ${covered} partis sur 15 se prononcent clairement sur : ${axis.title}.`);
    const answer=state.answers[index];
    if(ranked.length && isPosition(answer) && (answer<=20 || answer>=80) && !ranked.some(party=>matrix[party.id].scores[index]!==null && Math.abs(answer-matrix[party.id].scores[index])<15)){
      messages.push(`Votre position sur ${axis.title} n'est portée par aucun parti de près.`);
    }
  });
  return messages;
}

function answerPresentation(answer){
  const positioned=isPosition(answer), value=positioned?answer:50;
  const tone=!positioned||(value>=45 && value<=55)?'neutral':value<45?'a':'b';
  return {value,tone,strength:Math.abs(value-50)/50,pending:answer===null};
}
function futureValues(index,value){
  const simulated=Math.max(0,Math.min(100,value-8+((index*7)%17)));

  return {vote:value,simulated,application};
}

}

  dialog.addEventListener('keydown',event=>{
    if(event.key!=='Tab')return;
    const focusable=[...dialog.querySelectorAll('button,summary,a[href]')].filter(element=>element.getClientRects().length);
    const first=focusable[0],last=focusable[focusable.length-1];
    if(event.shiftKey&&(document.activeElement===first||document.activeElement===dialog.querySelector('#reading-title'))){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  });
  document.body.append(dialog);
  document.body.style.overflow='hidden';
  opener.setAttribute('aria-expanded','true');
  dialog.showModal();
  dialog.querySelector('#reading-title').focus();
}
function updateAnswerUI(index){
  if(state.screen!=='ideas'||state.step!==index)return;
  const slider=document.getElementById('answer-slider');if(!slider)return;
  const answer=state.answers[index],view=answerPresentation(answer),card=document.getElementById('axis-card');
  const shown=toDisplay(index,view.value);
  slider.value=String(shown);slider.style.setProperty('--value',shown);slider.style.setProperty('--strength',view.strength);
  card.className=`axis-card answer-${view.tone} ${axes[index].flipped?'answer-flipped':''} ${view.pending?'answer-pending':''}`;card.style.setProperty('--strength',view.strength);
  document.getElementById('answer-status').textContent=responseText(answer,axes[index]);
  document.getElementById('no-opinion').setAttribute('aria-pressed',String(answer==='sans-avis'));
  const next=document.getElementById('next-question'),wasDisabled=next.disabled;
  next.disabled=answer===null;
  if(wasDisabled && !next.disabled && !state.nextInvited[index]){
    state.nextInvited[index]=true;
    if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
      next.classList.add('next-invitation');
      next.addEventListener('animationend',()=>next.classList.remove('next-invitation'),{once:true});
    }
  }
  if(state.modeFutur){
    const values=futureValues(index,view.value);
    for(const [key,value] of [['vote',values.vote],['simulation',values.simulated],['application',values.application]]){
      const displayed=toDisplay(index,value);
      document.getElementById('future-'+key+'-value').textContent=String(displayed);
      document.getElementById('future-'+key+'-bar').style.width=displayed+'%';
    }
  }
}
function classic(){return `<main class="page"><nav class="top-nav"><button class="back-link" onclick="app.go('home')">← Accueil</button><span class="nav-pill">Vote classique</span></nav><section class="panel"><h1>Vote classique par parti</h1><p>Cette entrée reproduit le geste électoral traditionnel : vous choisissez directement une formation politique.</p><div class="vote-grid">${parties.map(p=>`<button class="vote-card" style="--party:${p.color}" onclick="app.selectParty('${p.id}')"><span class="party-dot"></span><strong>${esc(p.name)}</strong></button>`).join('')}</div>${state.selectedParty?`<div class="method-box"><h2>Choix affiché</h2><p>Vous avez choisi : <strong>${esc(parties.find(p=>p.id===state.selectedParty).name)}</strong>. Cette entrée cohabite avec le bulletin par idées, elle ne le remplace pas.</p></div>`:''}</section></main>`;}
function forgotten(){return `<main class="page"><nav class="top-nav"><button class="back-link" onclick="app.go('home')">← Accueil</button><span class="nav-pill">Questions complémentaires</span></nav><section class="panel"><h1>5 questions oubliées</h1><p>Ces questions ne modifient pas le résultat du QCM. Elles servent à mettre sous les yeux du citoyen cinq sujets majeurs rarement chiffrés clairement par les partis politiques.</p>${forgottenProofPanel()}</section></main>`;}
function sourcePanel(party){
  return `<button class="source-toggle" aria-expanded="false" onclick="app.toggleSources(this)">Voir les sources</button><div class="source-panel" hidden>${axes.map((axis,index)=>{
    const score=matrix[party.id].scores[index],ic=matrix[party.id].ic[index],source=sources[party.id][index];
    const confidence={1:'sources insuffisantes',2:'moyen',3:'bon',4:'fort'}[ic];
    return `<article class="source-item"><h4>${index+1}. ${esc(axis.title)}</h4>${score===null?'<p class="excluded-position">Position non retenue : sources insuffisantes</p>':`<p>Position : <strong>${score}/100</strong></p>`}<p>IC${ic} = ${confidence}</p><p><strong>Source :</strong> ${esc(source.titre)}</p>${source.commentaire?`<p class="source-comment">${esc(source.commentaire)}</p>`:''}</article>`;
  }).join('')}</div>`;
}
function partyCard(party,rank){
  const nearest=[...party.per].sort((a,b)=>b.proximity-a.proximity||a.index-b.index).slice(0,2);
  const furthest=[...party.per].sort((a,b)=>a.proximity-b.proximity||a.index-b.index).slice(0,2);
  return `<article class="rank-card" style="--party:${party.color}" data-party="${party.id}"><div class="rank-card-header"><span class="rank">${rank}</span><h2>${esc(party.name)}</h2><strong class="rank-score">${party.score}%</strong></div><p class="coverage">sur ${party.compared} questions</p><div class="comparison-points"><div><h3>Les plus proches</h3><ul>${nearest.map(x=>`<li>${esc(x.title)} <span>${Math.round(x.proximity)}%</span></li>`).join('')}</ul></div><div><h3>Les plus éloignées</h3><ul>${furthest.map(x=>`<li>${esc(x.title)} <span>${Math.round(x.proximity)}%</span></li>`).join('')}</ul></div></div>${sourcePanel(party)}</article>`;
}
function allPartyRow(party,rank){return `<article class="all-party-card" style="--party:${party.color}"><div class="rank-card-header"><span class="rank">${rank}</span><h3>${esc(party.name)}</h3><strong class="rank-score">${party.score}%</strong></div><p class="coverage">sur ${party.compared} questions</p>${sourcePanel(party)}</article>`;}
function methodPanel(){return `<section class="method-box"><h2>Méthode et traçabilité</h2><p>Matrice des partis V7.4 (version 2 du bulletin) du 18 octobre 2026 : 15 partis, 12 questions, 180 positions. Chaque position vient d'une source publique (programme, vote à l'Assemblée, déclaration) et porte un indice de confiance. Les positions sans source suffisante sont retirées du calcul. Méthode : pour chaque question, proximité = 100 moins l'écart entre votre réponse et la position du parti ; le pourcentage est la moyenne sur les questions où vous avez une position. Sourcing croisé de Perplexity, Grok et Gemini, arbitré par Claude, validé par Jean Paul Poignand.</p><p>Historique : version 1 (mai 2026), prototype retiré après l'audit du 18 octobre 2026 ; version 2 (18 octobre 2026), 12 questions refondues, 15 partis, positions sourcées avec indice de confiance. Version 2.1 (18 octobre 2026) : six questions affichées dans l'autre sens pour obliger à lire les deux options, zone d'équilibre, explication du mode futur. Version 2.2 (18 octobre 2026) : tableau « Le soir du vote, 20 heures » en mode futur. Version 2.3 (18 octobre 2026) : boutons en volume pour indiquer clairement où appuyer. Version 2.4 (18 octobre 2026) : modifier ses réponses ou recommencer à zéro, sans rien enregistrer sur l'appareil ; bouton « Partager ». Version 2.5 (19 octobre 2026) : l'explication du mode futur n'apparaît plus qu'à l'activation du mode futur.</p></section><section class="method-box doctrine-info"><h2>À propos de cet outil</h2><p><strong>Vos idées d'abord. Les partis seulement à la fin.</strong> Répondez à 12 questions, puis découvrez les proximités politiques, les convergences, les divergences et les sources.</p><div class="promise-row"><span>12 questions</span><span>15 partis</span><span>Version 2</span><span>Sources consultables</span></div><p class="soft">Le moteur compare ensuite vos réponses à la matrice sourcée V7.4.</p></section>`;}
function result(){
  const ranked=results(),n=positionCount(),gaps=measuredGaps(ranked),eligible=new Set(ranked.map(p=>p.id));
  const unranked=parties.filter(p=>!eligible.has(p.id));
  let content;
  if(n<6){content=`<div class="insufficient-answers"><p>Vous avez donné moins de 6 positions : un classement ne serait pas fiable. Revenez sur quelques questions pour obtenir un résultat.</p><button class="btn primary" onclick="app.resume()">Revenir aux questions</button></div>`;}
  else{content=`<div class="certainty"><strong>${certainty()}</strong><span>${n} positions exprimées sur 12 questions</span></div>${n<=8?'<p class="limited-positions" role="note">Vous avez répondu « Sans avis » à plusieurs questions : ce résultat repose sur peu de positions.</p>':''}<div class="result-grid">${ranked.slice(0,4).map((party,index)=>partyCard(party,index+1)).join('')}</div><button class="all-parties-toggle" aria-expanded="false" aria-controls="all-parties" onclick="app.toggleAll(this)">Voir tous les partis</button><div id="all-parties" hidden>${ranked.map((party,index)=>allPartyRow(party,index+1)).join('')}${unranked.map(party=>`<article class="all-party-card"><h3>${esc(party.name)}</h3><p>Non classé : ${comparedQuestions(party.id).length} questions communes, moins de 6.</p>${sourcePanel(party)}</article>`).join('')}</div>${gaps.length?`<section class="measured-gaps"><h2>Vos attentes et l'offre politique</h2>${gaps.map(message=>`<p>${esc(message)}</p>`).join('')}</section>`:''}`;}
  return `<main class="page"><nav class="top-nav"><button class="back-link" onclick="app.go('home')">← Accueil</button><span class="nav-pill">Résultat</span></nav><section class="panel result-panel"><div class="version-notice" role="note"><p>Ce classement compare vos réponses aux positions publiées des partis (version 2.4 du 18 octobre 2026). C'est une aide à la réflexion, pas un conseil de vote.</p></div><h1>Vos réponses sont les plus proches de…</h1>${content}<section class="vote-next-actions" aria-labelledby="vote-next-title"><h2 id="vote-next-title">Et maintenant ?</h2><div class="vote-action-row"><button class="btn primary" onclick="app.modify()">✏️ Modifier mes réponses</button><button class="btn reset-secondary" onclick="app.requestReset(this)">↺ Recommencer à zéro</button></div><p>🔒 Vos réponses ne sont enregistrées nulle part : elles disparaissent dès que vous fermez la page.</p></section>${state.modeFutur?eveningPanel():''}${forgottenProofPanel()}${methodPanel()}</section></main>`;
}
function resetVote(){
  state.answers=axes.map(()=>null);
  state.nextInvited=axes.map(()=>false);
  state.step=0;
  state.selectedParty=null;
  state.screen='home';
  render();
  window.scrollTo(0,0);
}
function requestReset(opener){
  if(document.getElementById('reset-dialog'))return;
  const dialog=document.createElement('dialog');
  dialog.id='reset-dialog';
  dialog.className='reset-dialog';
  dialog.setAttribute('role','dialog');
  dialog.setAttribute('aria-modal','true');
  dialog.setAttribute('aria-labelledby','reset-dialog-title');
  dialog.innerHTML=`<div class="reset-dialog-card"><h2 id="reset-dialog-title">Effacer vos 12 réponses&nbsp;?</h2><p>Le bulletin repartira de zéro, comme pour une nouvelle personne. Cette action ne peut pas être annulée.</p><div class="vote-action-row"><button class="btn reset-secondary" data-reset-confirm>Oui, tout effacer</button><button class="btn primary" data-reset-cancel>Non, garder mes réponses</button></div></div>`;
  const cancel=dialog.querySelector('[data-reset-cancel]'),confirm=dialog.querySelector('[data-reset-confirm]');
  function close(){dialog.close();dialog.remove();if(opener.isConnected)opener.focus();}
  cancel.addEventListener('click',close);
  confirm.addEventListener('click',()=>{close();resetVote();});
  dialog.addEventListener('cancel',event=>{event.preventDefault();close();});
  dialog.addEventListener('click',event=>{if(event.target===dialog)close();});
  dialog.addEventListener('keydown',event=>{
    if(event.key!=='Tab')return;
    if(event.shiftKey&&document.activeElement===confirm){event.preventDefault();cancel.focus();}
    else if(!event.shiftKey&&document.activeElement===cancel){event.preventDefault();confirm.focus();}
  });
  document.body.append(dialog);
  dialog.showModal();
  cancel.focus();
}
function render(){
  root.innerHTML=state.screen==='home'?home():state.screen==='ideas'?ideas():state.screen==='classic'?classic():state.screen==='forgotten'?forgotten():result();
}
window.app={
  go(screen){state.screen=screen;if(screen==='ideas'){const first=state.answers.findIndex(answer=>answer===null);state.step=first<0?0:first;}render();},toggle,
  setAnswer(index,value){const n=Number(value);if(!Number.isInteger(index)||index<0||index>=axes.length||!Number.isFinite(n))return;state.answers[index]=toStored(index,Math.max(0,Math.min(100,n)));updateAnswerUI(index);},
  noOpinion(index){state.answers[index]='sans-avis';updateAnswerUI(index);},
  next(){if(state.answers[state.step]===null)return;if(state.step>=11)state.screen='result';else state.step+=1;render();},
  prev(){state.step=Math.max(0,state.step-1);render();},
  resume(){state.screen='ideas';const first=state.answers.findIndex(answer=>!isPosition(answer));state.step=first<0?0:first;render();},
  modify(){state.screen='ideas';state.step=0;render();},
  requestReset,openReading,
  selectParty(id){if(parties.some(party=>party.id===id)){state.selectedParty=id;render();}},
  toggleAll(button){const panel=document.getElementById('all-parties');panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));},
  toggleSources(button){const panel=button.nextElementSibling;panel.hidden=!panel.hidden;button.setAttribute('aria-expanded',String(!panel.hidden));}
};
render();
    </script>
  </body>
</html>
