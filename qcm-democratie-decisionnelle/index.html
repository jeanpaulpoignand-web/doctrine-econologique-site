let state = { screen:'home', modeFutur:false, answers: axes.map(()=>50), selectedParty:null };

function esc(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function displayVal(i){return axes[i].inv ? 100-state.answers[i] : state.answers[i]}
function calcVal(i){return state.answers[i]}
function proximity(user, party){return Math.max(0,100-Math.abs(user-party))}
function results(){return parties.map(p=>{const per=axes.map((a,i)=>proximity(calcVal(i), partyScores[p.id][i])); return {...p, score: Math.round(per.reduce((a,b)=>a+b,0)/per.length), per};}).sort((a,b)=>b.score-a.score)}
function blindSpots(){const rows=[]; axes.forEach((a,i)=>{const best=Math.max(...parties.map(p=>proximity(calcVal(i),partyScores[p.id][i]))); if(best<70 || a.blindSpot) rows.push({axis:a.title,best,reason:a.blindSpot?'suivi des engagements et responsabilité politique insuffisamment couverts':'proximité faible avec l’offre politique'});}); return rows;}
